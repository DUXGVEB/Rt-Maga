[workspace]
resolver = "3"
members = [
    "crates/mangacore",
    "src-tauri",
]

[workspace.package]
version = "3.3.0"
edition = "2024"
rust-version = "1.92"
license-file = "LICENSE"
publish = false
authors = ["RtMaga"]

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chromiumoxide = { version = "0.9", default-features = false }
crc32fast = "1"
dashmap = "6"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
hayro = "0.9"
hmac = "0.12"
http = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
imagesize = "0.13"
infer = { version = "0.19", default-features = false }
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
moka = { version = "0.12", features = ["future"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std", "directml", "api-17"] }
prost = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
quick-xml = "0.38"
rand = "0.8"
rars = { version = "0.13", default-features = false, features = ["encryption"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "deflate", "json", "socks"] }
rmp-serde = "1"
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = { version = "0.20", default-features = false, features = ["aes256", "deflate", "ppmd", "util"] }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tar = { version = "0.4", default-features = false }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_assert_message = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"

exhaustive_enums = "warn"

string_add = "warn"
wildcard_imports = "warn"

dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
